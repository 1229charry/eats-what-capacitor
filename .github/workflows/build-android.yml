name: Build Android APK
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies and sync Capacitor
        run: |
          npm install
          npx cap sync android
          echo "=== Android directory structure ==="
          ls -la android/
          ls -la android/app/
          echo "=== Checking gradlew ==="
          ls -la android/gradlew
          echo "=== Checking local.properties ==="
          cat android/local.properties 2>/dev/null || echo "No local.properties"
          echo "=== ANDROID_SDK_ROOT ==="
          echo $ANDROID_SDK_ROOT
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo "=== SDK Manager list ==="
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null || echo "sdkmanager not found at expected path"
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tail -200
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eats-what-apk
          path: android/app/build/outputs/apk/debug/*.apk
